name: Generar APK

on:
  push:
    branches: [main]
    # Al subir una etiqueta de versión (v0.2.0-alpha...) se publica una release con el APK
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Los secretos no se pueden usar directamente en un "if", así que se pasan por aquí
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # El SDK de Android ya viene instalado en los servidores de GitHub (ANDROID_HOME)

      - name: Instalar dependencias
        run: npm ci

      - name: Probar el backend
        run: npm run test:backend

      - name: Compilar la web y copiarla a Android
        run: npm run android:sync

      - name: Preparar la clave de firma
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/diaadia.jks
          cat > android/keystore.properties <<PROPS
          storeFile=diaadia.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=diaadia
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Generar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ponerle nombre con la versión
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/dia-a-dia-$VERSION.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: dia-a-dia-apk
          path: out/*.apk

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/*.apk
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: false
          body_path: CHANGELOG.md
